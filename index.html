    <script>
      // Benign container and remote stylesheet error filter
      (function() {
        const _origErr = console.error;
        const _origWarn = console.warn;
        const isBenign = (arg) => {
          if (typeof arg === 'string') {
            return (
              arg.includes('[vite] failed to connect to websocket') ||
              arg.includes('vite-plugin-pwa:dev-ready') ||
              arg.includes('cssRules') ||
              arg.includes('Error inlining remote css file') ||
              arg.includes('Error while reading CSS rules')
            );
          }
          if (arg && arg.message && typeof arg.message === 'string') {
            return (
              arg.message.includes('cssRules') ||
              arg.message.includes('Cannot access rules') ||
              arg.message.includes('Error inlining remote css file')
            );
          }
          return false;
        };

        console.error = function(...args) {
          if (args.some(isBenign)) return;
          _origErr.apply(console, args);
        };
        console.warn = function(...args) {
          if (args.some(isBenign)) return;
          _origWarn.apply(console, args);
        };
      })();
    </script>
